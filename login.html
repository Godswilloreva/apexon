<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Competentraders</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .card {
            background: #1e293b;
            border-radius: 12px;
            padding: 32px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            border: 1px solid #334155;
            position: relative;
        }

        .title {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 20px;
            color: #38bdf8;
            text-align: center;
        }

        .form-group {
            margin-bottom: 18px;
            position: relative;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-size: 14px;
            color: #94a3b8;
        }

        input {
            width: 100%;
            padding: 12px;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 6px;
            color: #fff;
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus {
            border-color: #38bdf8;
        }

        .password-wrapper {
            position: relative;
        }

        .toggle-btn {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            color: #64748b;
        }

        .toggle-btn svg {
            width: 20px;
            height: 20px;
            stroke: currentColor;
            fill: none;
            stroke-width: 2;
        }

        .btn {
            width: 100%;
            padding: 12px;
            background: #0284c7;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn:hover {
            background: #0369a1;
        }

        .btn:disabled {
            background: #475569;
            cursor: not-allowed;
        }

        .error-msg {
            color: #f87171;
            font-size: 13px;
            margin-bottom: 16px;
            display: none;
            text-align: center;
        }

        /* Loading Overlay */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(15, 23, 42, 0.9);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
        }

        .overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #334155;
            border-top: 4px solid #38bdf8;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div class="card">
        <h2 class="title">Authorize Access</h2>

        <div id="errorMsg" class="error-msg"></div>

        <form id="loginForm">
            <div class="form-group">
                <label for="loginIdentity">Username or Email</label>
                <input type="text" id="loginIdentity" placeholder="Enter username or email" required autocomplete="username">
            </div>

            <div class="form-group">
                <label for="loginPassword">Password</label>
                <div class="password-wrapper">
                    <input type="password" id="loginPassword" placeholder="Enter password" required autocomplete="current-password">
                    <button type="button" class="toggle-btn" id="togglePasswordBtn" aria-label="Toggle password visibility">
                        <svg id="eyeIcon" viewBox="0 0 24 24">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                            <circle cx="12" cy="12" r="3"></circle>
                        </svg>
                    </button>
                </div>
            </div>

            <button type="submit" id="submitBtn" class="btn">Authorize Access</button>
        </form>

        <div id="loadingOverlay" class="overlay">
            <div class="spinner"></div>
        </div>
    </div>

    <!-- FIREBASE AUTHENTICATION & LOGIN SCRIPT -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCrjHf4jXF-12q0Ux9FXuC9qvPbtSybiGg",
            authDomain: "apexon-18436.firebaseapp.com",
            projectId: "apexon-18436",
            storageBucket: "apexon-18436.firebasestorage.app",
            messagingSenderId: "860159843934",
            appId: "1:860159843934:web:d149cd4766935be2525ecf",
            measurementId: "G-TZ7QJMGJK0"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const form = document.getElementById('loginForm');
        const overlay = document.getElementById('loadingOverlay');
        const errorMsg = document.getElementById('errorMsg');
        const passInput = document.getElementById('loginPassword');
        const toggleBtn = document.getElementById('togglePasswordBtn');
        const eyeIcon = document.getElementById('eyeIcon');
        const submitBtn = document.getElementById('submitBtn');

        // Toggle Password Visibility
        toggleBtn.addEventListener('click', function() {
            var isPassword = passInput.getAttribute('type') === 'password';
            passInput.setAttribute('type', isPassword ? 'text' : 'password');
            eyeIcon.innerHTML = isPassword 
                ? '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line>'
                : '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle>';
        });

        // Form Submit Handler
        form.addEventListener('submit', async function(e) {
            e.preventDefault();
            errorMsg.style.display = 'none';

            const identityInput = document.getElementById('loginIdentity').value.trim().toLowerCase();
            const password = passInput.value;

            submitBtn.disabled = true;
            submitBtn.textContent = "Authorizing...";

            let targetEmail = identityInput;

            try {
                // Check if user entered a username instead of an email address
                if (!identityInput.includes('@')) {
                    const usernameDocRef = doc(db, "usernames", identityInput);
                    const usernameSnap = await getDoc(usernameDocRef);

                    if (usernameSnap.exists()) {
                        targetEmail = usernameSnap.data().email;
                    } else {
                        throw new Error("Username not found");
                    }
                }

                // Authenticate with Firebase Auth
                const userCredential = await signInWithEmailAndPassword(auth, targetEmail, password);
                
                // Show loading overlay animation on successful authentication
                overlay.classList.add('active');

                setTimeout(() => {
                    window.location.href = "dashboard.html";
                }, 2000);

            } catch (error) {
                console.error("Login Error:", error);
                errorMsg.textContent = "❌ Invalid credentials or account does not exist.";
                errorMsg.style.display = 'block';
                submitBtn.disabled = false;
                submitBtn.textContent = "Authorize Access";
            }
        });
    </script>
</body>
</html>
